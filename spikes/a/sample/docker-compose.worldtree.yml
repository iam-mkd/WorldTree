# Per-worktree override. Requires Compose >= 2.24 for !reset / !override.
services:
  postgres: { container_name: !reset null, ports: !override ["${PG_PORT}:5432"] }
  redis:    { container_name: !reset null, ports: !override ["${REDIS_PORT}:6379"] }
  app:      { container_name: !reset null, ports: !override ["${APP_PORT}:8080"] }

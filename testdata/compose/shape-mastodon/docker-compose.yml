# Synthetic fixture shaped like mastodon's compose file (not a copy): loopback-only ports,
# an internal network, relative binds, env_file, a build context.
services:
  db:
    image: postgres:14-alpine
    networks: [internal_network]
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }
    volumes: [./postgres14:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    networks: [internal_network]
    volumes: [./redis:/data]
  web:
    build: .
    env_file: .env.production
    command: bundle exec puma -C config/puma.rb
    networks: [external_network, internal_network]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [db, redis]
    volumes: [./public/system:/mastodon/public/system]
  streaming:
    build: { context: ., dockerfile: streaming/Dockerfile }
    env_file: .env.production
    networks: [external_network, internal_network]
    ports: ["127.0.0.1:4000:4000"]
    depends_on: [db, redis]
networks:
  external_network:
  internal_network:
    internal: true

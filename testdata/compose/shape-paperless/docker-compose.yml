# Synthetic fixture shaped like paperless-ngx's compose file (not a copy):
# named volumes, one fixed host port, env_file, restart policies.
services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes: [redisdata:/data]
  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    volumes: [pgdata:/var/lib/postgresql/data]
    environment: { POSTGRES_DB: paperless, POSTGRES_USER: paperless, POSTGRES_PASSWORD: paperless }
  webserver:
    image: ghcr.io/example/docs-server:latest
    restart: unless-stopped
    depends_on: [db, broker]
    ports: ["8000:8000"]
    volumes: [data:/usr/src/paperless/data, media:/usr/src/paperless/media, ./export:/usr/src/paperless/export]
    env_file: docker-compose.env
    environment: { PAPERLESS_REDIS: "redis://broker:6379", PAPERLESS_DBHOST: db }
volumes:
  data:
  media:
  pgdata:
  redisdata:
